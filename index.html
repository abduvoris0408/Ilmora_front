<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ilmora — savdo va biznesni boshqarish tizimi" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ilmora</title>

    <!--
      Mavzu birinchi chizishdan OLDIN qo'llanadi (aks holda dark rejimda oq "miltillash").
      Mantiq src/lib/theme/apply-preferences.ts bilan bir xil — birini o'zgartirsangiz, ikkinchisini ham.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ilmora.preferences");
          var p = (raw && JSON.parse(raw).state) || {};
          var mode = p.mode || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement;
          r.classList.toggle("dark", dark);
          r.style.colorScheme = dark ? "dark" : "light";
          var b = p.brand;
          if (b) {
            r.style.setProperty("--brand-l", b.l);
            r.style.setProperty("--brand-c", b.c);
            r.style.setProperty("--brand-h", b.h);
            if (b.dl != null) r.style.setProperty("--brand-dl", b.dl);
            var FG = { light: "oklch(1 0 0)", dark: "oklch(0.18 0.02 265)" };
            if (b.fg) r.style.setProperty("--brand-fg", FG[b.fg]);
            if (b.dfg) r.style.setProperty("--brand-fg-dark", FG[b.dfg]);
          }
          if (p.radius != null) r.style.setProperty("--radius", p.radius + "rem");
          if (p.fontScale) r.style.fontSize = p.fontScale + "%";
          r.dataset.sidebarStyle = p.sidebarStyle || "light";
          r.dataset.density = p.density || "comfortable";
          r.dataset.layout = p.layout || "left";
          var lang = localStorage.getItem("ilmora.lang");
          if (lang) r.lang = lang;
        } catch (e) {}
      })();
    </script>

    <style>
      /* Boot splash — JS yuklanguncha. Ranglar tokens.css bilan bir xil (CSS hali yuklanmagan). */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fff;
      }
      .dark #boot {
        background: oklch(0.16 0.01 265);
      }
      #boot .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      #boot .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: #fff;
        background: oklch(var(--brand-l, 0.56) var(--brand-c, 0.21) var(--brand-h, 259));
      }
      #boot .bar {
        position: relative;
        width: 144px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: oklch(var(--brand-l, 0.56) var(--brand-c, 0.21) var(--brand-h, 259) / 15%);
      }
      #boot .bar::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: oklch(var(--brand-l, 0.56) var(--brand-c, 0.21) var(--brand-h, 259));
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-busy="true" aria-label="Ilmora">
        <div class="wrap">
          <div class="logo">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" aria-hidden="true">
              <path
                d="M7 4.5v15M12 9v10.5M17 4.5v15"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
              />
              <circle cx="12" cy="4.6" r="1.7" fill="currentColor" />
            </svg>
          </div>
          <div class="bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
